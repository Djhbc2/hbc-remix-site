<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دمو ۵ | HBC REMIX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--orange:#ff9f0a;--red:#ff4438;--border:rgba(255,255,255,.16);--glass:rgba(255,255,255,.075)}
html,body{margin:0;height:100%;font-family:Vazirmatn,Arial,sans-serif;background:#050505;color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
.app{width:min(430px,100%);height:100dvh;margin:auto;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- صفحه لیست آهنگ‌ها ---------- */
#songsScreen{overflow-y:auto;padding:18px 18px 30px;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.logo-img{height:34px}
.icon-circle{
 width:38px;height:38px;border-radius:50%;flex-shrink:0;
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
 backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;transition:.15s
}
.icon-circle:active{transform:scale(.88)}
.title-row{display:flex;align-items:center;margin-bottom:14px}
.title-row h2{font-size:18px;margin:0}
.title-row h2:after{content:"";display:inline-block;width:30px;height:2px;background:var(--orange);margin-right:9px;vertical-align:middle}
.song{display:grid;grid-template-columns:54px 1fr auto 20px;align-items:center;gap:12px;padding:11px 3px;border-bottom:1px solid rgba(255,255,255,.08);width:100%;text-align:right;transition:.2s}
.song:active{transform:scale(.98)}
.song img{width:52px;height:52px;border-radius:14px;object-fit:cover}
.song b{display:block;font-size:14px}
.song small{display:block;color:rgba(255,255,255,.5);font-size:11px;margin-top:3px}
.song .time{color:#bbb;font-size:11px}
.song .dots{font-size:16px;color:rgba(255,255,255,.4)}

/* ---------- صفحه پلیر (ثابت، بدون اسکرول) ---------- */
#playerScreen{overflow:hidden}
.bg-cover{position:absolute;inset:0;z-index:0;overflow:hidden}
.bg-cover img{width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.5)}
.bg-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,.15) 0%,rgba(5,5,5,.6) 50%,#050505 88%)}
.p-header{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px 0;flex-shrink:0}
.searchbox{flex:1;height:38px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);display:flex;align-items:center;gap:8px;padding:0 14px;color:rgba(255,255,255,.4);font-size:12px;min-width:0}
.searchbox span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 16px 0}
.cover-wrap{flex:1;min-height:0;width:100%;border-radius:28px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.55)}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.meta{text-align:center;padding:14px 0 6px;flex-shrink:0}
.meta h1{font-size:19px;margin:0}
.meta .sub{color:var(--orange);font-size:11px;margin-top:3px}
.meta .artist{color:rgba(255,255,255,.55);font-size:12px;margin-top:5px}
.meta-actions{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:10px;flex-shrink:0}
.icon-col{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0}
.icon-col span{font-size:9px;color:rgba(255,255,255,.45)}
.icon-btn-sm{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn-sm:active{transform:scale(.88)}
.icon-btn-sm.download{color:var(--red);border-color:rgba(255,68,56,.5);background:rgba(255,68,56,.1)}
.waveform{flex:1;height:22px;margin:8px 12px 0;display:flex;align-items:flex-end;gap:2px}
.waveform i{flex:1;background:rgba(255,255,255,.18);border-radius:2px;min-width:2px}
.waveform i.on{background:var(--orange)}
.player-dock{position:relative;z-index:2;flex-shrink:0;margin:0 12px 10px;border-radius:26px;overflow:hidden;background:linear-gradient(165deg,rgba(35,30,25,.9),rgba(15,13,11,.94));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(28px);box-shadow:0 25px 60px rgba(0,0,0,.6);padding-bottom:env(safe-area-inset-bottom)}
.dock-top{display:flex;align-items:center;gap:11px;padding:12px 15px 4px}
.dock-top img{width:40px;height:40px;border-radius:11px;object-fit:cover;flex-shrink:0}
.dock-info{flex:1;min-width:0}
.dock-info b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-info small{display:block;font-size:10.5px;color:rgba(255,255,255,.5);margin-top:2px}
.dock-controls{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;direction:ltr!important}
.dock-controls button{width:36px;height:36px;border-radius:50%;transition:.15s;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85)}
.dock-controls button:active{transform:scale(.88)}
.dock-controls .play{width:52px;height:52px;color:#1a1200;background:linear-gradient(155deg,#ffb43d,var(--orange) 65%,#ff8a00);border:3px solid rgba(255,159,10,.35);box-shadow:0 10px 26px rgba(255,120,0,.4),inset 0 1px 1px rgba(255,255,255,.5)}
.dock-progress{padding:0 16px 8px;direction:ltr!important}
.dock-progress input{width:100%;accent-color:var(--orange);height:3px;display:block;direction:ltr}
.dock-progress .times{display:flex;justify-content:space-between;color:rgba(255,255,255,.45);font-size:10px;margin-top:2px;direction:ltr!important}
.dock-nav{display:flex;border-top:1px solid rgba(255,255,255,.08)}
.dock-nav button{flex:1;padding:10px 0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);transition:.15s}
.dock-nav button.active{color:var(--orange)}
.dock-nav button:active{transform:scale(.88)}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop-anim{animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
.toast{position:fixed;z-index:40;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;background:#20201e;padding:11px 16px;border-radius:13px;border:1px solid #444;transition:.25s;pointer-events:none;font-size:12px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.badge{position:fixed;top:6px;left:6px;z-index:50;background:var(--orange);color:#111;font-size:9px;padding:4px 9px;border-radius:20px;font-weight:700}
</style>
</head>

<div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);
const songs=[
 {title:"بغلم کن",artist:"ریمیکس امیر تتلو و مازیار فلاحی",cover:"https://picsum.photos/seed/hbc1/500",time:"04:02"},
 {title:"چشم به راه",artist:"DJ HBC",cover:"https://picsum.photos/seed/hbc2/500",time:"03:50"},
 {title:"شب تهران",artist:"HBC Crew",cover:"https://picsum.photos/seed/hbc3/500",time:"03:15"}
];
function esc(s=""){return s.replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\x27":"&#39;"}[c]));}
$("songs").innerHTML=songs.map((s,i)=>`
 <button class="song" data-i="${i}"><img src="${s.cover}"><div><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></div><span class="time">${s.time}</span><span class="dots">\u2022\u2022\u2022</span></button>`).join("");

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}

function openPlayer(i){
  const s=songs[i];
  $("bgImg").src=s.cover;$("coverImg").src=s.cover;$("dockCover").src=s.cover;
  $("playerTitle").textContent=s.title;$("playerArtist").textContent=s.artist;
  $("dockTitle").textContent=s.title;$("dockArtist").textContent=s.artist;
  $("dockTotal").textContent=s.time;
  showScreen("playerScreen");
  const wf=$("waveform");
  let bars="";
  for(let k=0;k<36;k++){
    const h=6+Math.round(Math.random()*16);
    bars+=`<i style="height:${h}px" class="${k<13?"on":""}"></i>`;
  }
  wf.innerHTML=bars;
}
document.querySelectorAll("#songs .song").forEach(b=>b.onclick=()=>openPlayer(+b.dataset.i));
$("backBtn").onclick=()=>showScreen("songsScreen");

let playing=true;
$("play").onclick=()=>{
  playing=!playing;
  $("playIcon").innerHTML=playing
    ? '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>'
    : '<path d="M8 5v14l11-7-11-7z" fill="currentColor"/>';
};

document.querySelectorAll(".dock-controls button,.icon-btn-sm,.dock-nav button,.icon-circle").forEach(btn=>{
  btn.addEventListener("click",()=>{
    btn.classList.remove("pop-anim");
    void btn.offsetWidth;
    btn.classList.add("pop-anim");
  });
});
</script>
